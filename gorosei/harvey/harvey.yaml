# Harvey, directeur commercial du Gorosei (agence de sites web 3D).
# Mode BROUILLON : aucun envoi. Harvey prépare, valide et range les messages ;
# le fondateur relit et envoie lui-même depuis sa boîte.
# Adapté depuis ethanplusai/harvey (MIT) : voir LICENSE.

persona:
  name: "Harvey"
  company: "Maison Vitura"
  role: "Directeur commercial"
  email: ""                       # volontairement vide : aucune boîte connectée
  linkedin: ""
  tone: "chaleureux, direct, professionnel, vouvoiement"

product:
  name: "Sites internet 3D animés"
  description: "Des sites vitrine pour boutiques et marques premium : le produit, le bouquet ou la montre se met en mouvement au défilement de la page. Une maquette gratuite faite avec les photos du commerce."
  pricing: "À partir de 1 500 € pour une page d'accueil 3D, livraison en 14 jours"
  key_benefits:
    - "Vos produits mis en mouvement sur la première page que voit un client"
    - "Une maquette gratuite faite avec vos propres photos, sans engagement"
    - "Livraison en 14 jours, utile avant les pics de fêtes"
  objection_responses:
    "trop cher": "Je comprends que le budget compte. Je peux vous montrer la maquette avant de parler prix : c'est gratuit."
    "déjà un site": "C'est une bonne base. Qu'est-ce que votre site ne montre pas encore de vos produits ?"
    "pas intéressé": "Aucun souci. Puis-je vous demander seulement si vous avez déjà pensé à votre page d'accueil ?"
  offer:
    primary: "Page d'accueil 3D sur mesure"
    entry: "Maquette gratuite de votre page d'accueil avec vos photos"
    goal: "get_reply"
    booking_method: "ask_preference"
    booking_url: ""
    meeting_duration: "15 minutes"
    meeting_owner: "[Prénom], fondateur"

icp:
  industries:
    - "Fleuristes"
    - "Boutiques premium"
    - "Marques de produits premium indépendantes"
  company_size: "1-20 salariés"
  titles:
    - "Fondateur"
    - "Gérant"
    - "Propriétaire"
  geography:
    - "France"
    - "Paris"
  hiring_signals: []

channels:
  email:
    enabled: false               # aucun envoi tant que le fondateur ne l'autorise
    provider: "smtp"
    max_daily_sends: 0
    require_approval: true
    send_to_risky: false
    max_bounce_rate: 0.05
  linkedin:
    enabled: false               # désactivé : l'automatisation LinkedIn viole ses CGU

usage:
  max_daily_claude_percent: 50
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "22:00"
    end: "07:00"
    timezone: "Europe/Paris"

compliance:
  precleared:
    enabled: false               # à activer avant tout envoi réel (clé PRECLEARED_API_KEY)
    sender_country: "FR"
    address_source: "published"
